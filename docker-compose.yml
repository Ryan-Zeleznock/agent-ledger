# Optional local server-mode lab. Kubernetes in docs/HOMELAB.md is the reference deployment.
# Build only after A+B integration. CONFIG_DIR is absolute and files belong to LOCAL_UID (nonzero).
# upstreams.yaml for Compose must use http://demo-upstream:3001/mcp.
services:
  proxy:
    build: .
    image: agent-ledger:slice-2a
    user: "${LOCAL_UID:?set the nonroot config owner uid}:${LOCAL_GID:?set the config owner gid}"
    command: [dist/server/main.js]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["127.0.0.1:8787:8787"]
    environment:
      AGENT_LEDGER_CONFIG_DIR: /run/agent-ledger
      AGENT_LEDGER_LEDGER_URL: postgres://ledger_app@postgres:5432/ledger
      AGENT_LEDGER_PORT: "8787"
      AGENT_LEDGER_BIND_HOST: 0.0.0.0
      AGENT_LEDGER_ALLOWED_ORIGINS: ""
      AGENT_LEDGER_APPROVALS: none
      AGENT_LEDGER_TLS: "off"   # Slice 2b: required; this local lab publishes on 127.0.0.1 only
    volumes: ["${CONFIG_DIR:?absolute staged config dir}:/run/agent-ledger:ro"]
    depends_on:
      postgres: {condition: service_healthy}
      demo-upstream: {condition: service_started}
    networks: [ledger-internal]
  demo-upstream:
    image: agent-ledger:slice-2a
    user: "${LOCAL_UID:?}:${LOCAL_GID:?}"
    command: [dist/server/demo-upstream.js]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      AGENT_LEDGER_DEMO_PORT: "3001"
      AGENT_LEDGER_DEMO_TOKEN_FILE: /run/token
    volumes: ["${CONFIG_DIR:?}/secrets/demo.bearerToken:/run/token:ro"]
    networks: [ledger-internal]
  postgres:
    image: docker.io/library/postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    user: "70:70"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_DB: ledger
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"
      LEDGER_APP_PASSWORD: "${LEDGER_APP_PASSWORD:?must match CONFIG_DIR/ledger.password}"
      LEDGER_READER_PASSWORD: "${LEDGER_READER_PASSWORD:?}"
      PGDATA: /var/lib/postgresql/data/pgdata
    tmpfs: [/tmp, /var/run/postgresql:uid=70,gid=70,mode=0770]
    volumes:
      - ledger-data:/var/lib/postgresql/data
      - ./deploy/k8s/config/001_init.sh:/docker-entrypoint-initdb.d/001_init.sh:ro
      - ./deploy/sql/001_init.sql:/etc/agent-ledger-init/001_init.sql:ro
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -d, ledger]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [ledger-internal]
networks:
  ledger-internal: {internal: true}
volumes:
  ledger-data: {}
