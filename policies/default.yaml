version: 1
# Rules are evaluated top to bottom; the first match wins. Unmatched calls get defaultDecision.
defaultDecision:
  verdict: allow
  risk: write
  ruleId: default
  reason: Unclassified action, logged
rules:
  # Read tools first, so a name like list_roles or get_deploy_status is never escalated by the risky rules.
  - id: read-only
    match: { tool: "^(get|list|read|search|describe|fetch|query)_" }
    verdict: allow
    risk: read
    reason: Read-only action, logged
  # Nonprod exception before risky-prod-deploy: only a known nonprod environment is allowed through.
  - id: nonprod-deploy
    match: { tool: "(deploy|release|merge)", argPattern: { environment: "^(dev|development|test|staging|sandbox)$" } }
    verdict: allow
    risk: write
    reason: Deploy to a nonprod environment, logged
  - id: risky-delete
    match: { tool: "(delete|remove|destroy|drop|purge)" }
    verdict: require_approval
    risk: risky
    reason: Destructive action
  - id: risky-payment
    match: { tool: "(pay|charge|refund|transfer|payout|invoice_send)" }
    verdict: require_approval
    risk: risky
    reason: Money movement
  - id: risky-external-message
    match: { tool: "(send_email|send_message|post_message|tweet)" }
    verdict: require_approval
    risk: risky
    reason: Message to recipients outside the company
  - id: risky-iam-change
    match: { tool: "(iam|role|policy|permission|grant|invite_user)" }
    verdict: require_approval
    risk: risky
    reason: Permission change
  # No argPattern: a deploy with an unknown, missing, or prod environment requires approval.
  - id: risky-prod-deploy
    match: { tool: "(deploy|release|merge)" }
    verdict: require_approval
    risk: risky
    reason: Production or unknown-environment change
  - id: default-write
    match: { tool: "(create|update|write|edit|put|set)" }
    verdict: allow
    risk: write
    reason: Non-destructive write, logged
