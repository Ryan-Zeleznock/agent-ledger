customRules:
  agent-ledger.yaml: >
    - rule: Agent Ledger proxy spawned a process
      desc: In the distroless Agent Ledger image only the image's own node binary may run, and only as the entrypoint (server audit P3, 2026-10-05). A process named node elsewhere, or node spawned by node (a child process), is anomalous; the integration Job runs smoke.js as a node child on purpose. Entrypoint /nodejs/bin/node verified from the pinned image config 2026-10-05.
      condition: spawned_process and container and k8s.ns.name = "agent-ledger" and container.image.repository endswith "ryan-zeleznock/agent-ledger" and (not proc.exepath = "/nodejs/bin/node" or ((proc.pname = "node" or proc.pexepath = "/nodejs/bin/node") and not k8s.pod.label[app] = "integration"))
      output: "Agent Ledger process (namespace=%k8s.ns.name pod=%k8s.pod.name process=%proc.name command=%proc.cmdline)"
      priority: WARNING
      tags: [agent-ledger]
    - rule: Shell in agent-ledger namespace
      desc: A shell outside the BusyBox stage-config init container needs investigation. `busybox sh` runs as proc.name busybox, so busybox itself counts (server audit P3, 2026-10-05).
      condition: spawned_process and container and k8s.ns.name = "agent-ledger" and (proc.name in (sh, ash, bash, dash, busybox) or proc.exepath endswith "/busybox") and not (container.image.repository endswith "library/busybox" and container.name = "stage-config")
      output: "Agent Ledger shell (namespace=%k8s.ns.name pod=%k8s.pod.name process=%proc.name command=%proc.cmdline)"
      priority: NOTICE
      tags: [agent-ledger]
