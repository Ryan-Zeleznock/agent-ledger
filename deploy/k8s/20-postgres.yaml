apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: agent-ledger
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: tcp
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: agent-ledger
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
        fsGroupChangePolicy: OnRootMismatch
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: postgres
          image: docker.io/library/postgres:17.11-alpine3.24
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: ledger
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: LEDGER_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: LEDGER_APP_PASSWORD
            - name: LEDGER_READER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: LEDGER_READER_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - ledger
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              readOnly: false
            - name: socket
              mountPath: /var/run/postgresql
              readOnly: false
            - name: tmp
              mountPath: /tmp
              readOnly: false
            - name: init
              mountPath: /docker-entrypoint-initdb.d/001_init.sh
              readOnly: true
              subPath: 001_init.sh
            - name: init
              mountPath: /etc/agent-ledger-init
              readOnly: true
      volumes:
        - name: socket
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 365
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
