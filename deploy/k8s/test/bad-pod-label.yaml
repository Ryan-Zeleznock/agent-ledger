# Server audit P3 negative proof: an approved image taking the proxy's `app: proxy` label (and so the proxy's
# NetworkPolicy reach to Postgres, Slack and the upstreams) is denied. Server-side dry run only (HOMELAB step 7).
apiVersion: v1
kind: Pod
metadata:
  name: bad-pod-label
  namespace: agent-ledger
  labels:
    app: proxy
spec:
  serviceAccountName: integration
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  restartPolicy: Never
  containers:
    - name: test
      image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
      command: ["sh", "-c", "sleep 1"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 32Mi
