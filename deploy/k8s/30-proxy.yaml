apiVersion: v1
kind: Service
metadata:
  name: proxy
  namespace: agent-ledger
  labels:
    app: proxy
spec:
  selector:
    app: proxy
  ports:
    - name: tcp
      port: 8787
      targetPort: 8787
      nodePort: 30787
  type: NodePort
  externalTrafficPolicy: Local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  namespace: agent-ledger
  labels:
    app: proxy
    component: runtime
spec:
  # Slice 2b pin 9 (ADR-015): exactly ONE proxy per Slack app, and Recreate so a rollout never runs two Socket Mode
  # routers at once (Slack delivers each interactive payload to ANY open connection of the app; a second router eats
  # clicks). deploy/check.mjs asserts both.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: proxy
  template:
    metadata:
      labels:
        app: proxy
    spec:
      serviceAccountName: proxy
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull
      terminationGracePeriodSeconds: 15
      initContainers:
        - name: stage-config
          image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command:
            - sh
            - -ec
            - umask 077; mkdir -p /run/agent-ledger/secrets; cp /mnt/registry/registry.yaml
              /mnt/registry/upstreams.yaml /mnt/registry/approvals.yaml /mnt/secrets/agents.yaml
              /mnt/secrets/hmac.key /mnt/secrets/ledger.password /mnt/tls/tls.crt /mnt/tls/tls.key
              /run/agent-ledger/; cp /mnt/secrets/demo.bearerToken /mnt/slack/approvals.botToken
              /mnt/slack/approvals.appToken /run/agent-ledger/secrets/; chmod 600 /run/agent-ledger/*.*
              /run/agent-ledger/secrets/*
          securityContext: &a1
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: registry
              mountPath: /mnt/registry
              readOnly: true
            - name: secrets
              mountPath: /mnt/secrets
              readOnly: true
            - name: slack-tokens
              mountPath: /mnt/slack
              readOnly: true
            - name: proxy-tls
              mountPath: /mnt/tls
              readOnly: true
            - name: config
              mountPath: /run/agent-ledger
              readOnly: false
      containers:
        - name: proxy
          image: ghcr.io/ryan-zeleznock/agent-ledger:slice-2a
          args:
            - dist/server/main.js
          securityContext: *a1
          env:
            - name: AGENT_LEDGER_CONFIG_DIR
              value: /run/agent-ledger
            - name: AGENT_LEDGER_LEDGER_URL
              value: postgres://ledger_app@postgres.agent-ledger.svc.cluster.local:5432/ledger
            - name: AGENT_LEDGER_PORT
              value: "8787"
            - name: AGENT_LEDGER_BIND_HOST
              value: 0.0.0.0
            - name: AGENT_LEDGER_ALLOWED_ORIGINS
              value: ""
            - name: AGENT_LEDGER_APPROVALS
              value: slack
            - name: AGENT_LEDGER_TLS
              value: "on"
            - name: AGENT_LEDGER_UPSTREAM_CONNECT_BUDGET_MS
              value: "60000"
          ports:
            - containerPort: 8787
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # The root retries upstreams and then the Slack probe, each under the 60 s budget, before it listens:
          # 32 x 5 s = 160 s >= 2 x 60 s + 30 s (pin 6 "budget + 30 s", per retry loop).
          startupProbe:
            httpGet:
              path: /healthz
              port: 8787
              scheme: HTTPS
            periodSeconds: 5
            failureThreshold: 32
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8787
              scheme: HTTPS
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8787
              scheme: HTTPS
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /run/agent-ledger
              readOnly: true
      volumes:
        - name: config
          emptyDir:
            medium: Memory
            sizeLimit: 4Mi
        - name: registry
          configMap:
            name: proxy-registry
        - name: secrets
          secret:
            secretName: proxy-config
            defaultMode: 288
            items:
              - key: agents.yaml
                path: agents.yaml
              - key: hmac.key
                path: hmac.key
              - key: ledger.password
                path: ledger.password
              - key: demo.bearerToken
                path: demo.bearerToken
        # Slice 2b pin 5: the Slack tokens (bot xoxb-, app-level xapp-), staged into secrets/ as uid 65532, 0600.
        - name: slack-tokens
          secret:
            secretName: slack-tokens
            defaultMode: 288
            items:
              - key: approvals.botToken
                path: approvals.botToken
              - key: approvals.appToken
                path: approvals.appToken
        # ADR-017: the proxy's lab-CA server certificate (Secret type kubernetes.io/tls), staged into the config dir.
        - name: proxy-tls
          secret:
            secretName: proxy-tls
            defaultMode: 288
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
