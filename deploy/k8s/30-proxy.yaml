apiVersion: v1
kind: Service
metadata:
  name: proxy
  namespace: agent-ledger
  labels:
    app: proxy
spec:
  selector:
    app: proxy
  ports:
    - name: tcp
      port: 8787
      targetPort: 8787
      nodePort: 30787
  type: NodePort
  externalTrafficPolicy: Local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  namespace: agent-ledger
  labels:
    app: proxy
    component: runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy
  template:
    metadata:
      labels:
        app: proxy
    spec:
      serviceAccountName: proxy
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull
      terminationGracePeriodSeconds: 15
      initContainers:
        - name: stage-config
          image: docker.io/library/busybox:1.37.0
          command:
            - sh
            - -ec
            - umask 077; mkdir -p /run/agent-ledger/secrets; cp /mnt/registry/registry.yaml
              /mnt/registry/upstreams.yaml /mnt/secrets/agents.yaml /mnt/secrets/hmac.key
              /mnt/secrets/ledger.password /run/agent-ledger/; cp /mnt/secrets/demo.bearerToken
              /run/agent-ledger/secrets/demo.bearerToken; chmod 600 /run/agent-ledger/*.*
              /run/agent-ledger/secrets/*
          securityContext: &a1
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: registry
              mountPath: /mnt/registry
              readOnly: true
            - name: secrets
              mountPath: /mnt/secrets
              readOnly: true
            - name: config
              mountPath: /run/agent-ledger
              readOnly: false
      containers:
        - name: proxy
          image: ghcr.io/ryan-zeleznock/agent-ledger:slice-2a
          args:
            - dist/server/main.js
          securityContext: *a1
          env:
            - name: AGENT_LEDGER_CONFIG_DIR
              value: /run/agent-ledger
            - name: AGENT_LEDGER_LEDGER_URL
              value: postgres://ledger_app@postgres.agent-ledger.svc.cluster.local:5432/ledger
            - name: AGENT_LEDGER_PORT
              value: "8787"
            - name: AGENT_LEDGER_BIND_HOST
              value: 0.0.0.0
            - name: AGENT_LEDGER_ALLOWED_ORIGINS
              value: ""
            - name: AGENT_LEDGER_APPROVALS
              value: none
          ports:
            - containerPort: 8787
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8787
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8787
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /run/agent-ledger
              readOnly: true
      volumes:
        - name: config
          emptyDir:
            medium: Memory
            sizeLimit: 4Mi
        - name: registry
          configMap:
            name: proxy-registry
        - name: secrets
          secret:
            secretName: proxy-config
            defaultMode: 288
            items:
              - key: agents.yaml
                path: agents.yaml
              - key: hmac.key
                path: hmac.key
              - key: ledger.password
                path: ledger.password
              - key: demo.bearerToken
                path: demo.bearerToken
