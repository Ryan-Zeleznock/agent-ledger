apiVersion: batch/v1
kind: Job
metadata:
  name: integration
  namespace: agent-ledger
  labels:
    app: integration
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: integration
    spec:
      serviceAccountName: integration
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull
      restartPolicy: Never
      containers:
        - name: integration
          image: ghcr.io/ryan-zeleznock/agent-ledger:slice-2a
          args:
            - -e
            - |-
              const {spawnSync}=require('node:child_process'); const fs=require('node:fs');
              function run(args){const r=spawnSync(process.execPath,args,{encoding:'utf8',timeout:120000}); if(r.stdout)process.stdout.write(r.stdout); if(r.stderr)process.stderr.write(r.stderr); if(r.error || r.status!==0)process.exit(1); return r.stdout;}
              run(['dist/server/smoke.js','--url','https://proxy.agent-ledger.svc:8787/mcp','--key-file','/mnt/key/api-key','--approvals','slack','--ca-file','/mnt/ca/ca.crt','--expect-legacy','everything','--expect-upstream-401','http://demo-upstream:3001/mcp']);
              const args=['--ledger','postgres://ledger_reader@postgres:5432/ledger','--dir','/work'];
              run(['dist/cli/main.js','anchor',...args]);
              const verified=run(['dist/cli/main.js','verify',...args]);
              let state; try { state=JSON.parse(verified); } catch { process.exit(1); }
              if(state.anchor?.status!=="head")process.exit(1);
              for(const line of fs.readFileSync('/work/anchors.jsonl','utf8').trim().split('\n'))console.log('ANCHOR '+line);
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: LEDGER_READER_PASSWORD
          volumeMounts:
            - name: work
              mountPath: /work
              readOnly: false
            - name: key
              mountPath: /mnt/key
              readOnly: true
            - name: ca
              mountPath: /mnt/ca
              readOnly: true
      volumes:
        - name: work
          emptyDir: {}
        # server audit P3: the agent's api-key lives in its OWN Secret, so nothing that mounts proxy-config can read it.
        - name: key
          secret:
            secretName: agent-key
            defaultMode: 288
            items:
              - key: api-key
                path: api-key
        # Slice 2b pin 11 step 11: the lab CA certificate (public), created in HOMELAB step 5b.
        - name: ca
          configMap:
            name: proxy-ca
            items:
              - key: ca.crt
                path: ca.crt
