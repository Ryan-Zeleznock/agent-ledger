# Slice 2b pin 10: builds deploy/upstreams/everything (its own `git archive` context, HOMELAB step 4b). Same pattern as job.yaml.
apiVersion: batch/v1
kind: Job
metadata:
  name: kaniko-agent-ledger-everything
  namespace: build
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: kaniko-agent-ledger-everything
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: kaniko
          # ADR-018 §6: OCI index digest of v1.23.2, resolved from gcr.io 2026-10-05; deploy/check.mjs enforces the pin.
          image: gcr.io/kaniko-project/executor:v1.23.2@sha256:9e69fd4330ec887829c780f5126dd80edc663df6def362cd22e79bcdf00ac53f
          args:
            - --context=tar:///work/context.tar.gz
            - --dockerfile=Dockerfile
            - --destination=ghcr.io/ryan-zeleznock/agent-ledger:everything-2026.8.31
            - --digest-file=/dev/termination-log
            - --reproducible
            - --cache=false
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: context
              mountPath: /work
              readOnly: true
            - name: auth
              mountPath: /kaniko/.docker
              readOnly: true
      volumes:
        - name: context
          configMap:
            name: agent-ledger-everything-context
        - name: auth
          secret:
            secretName: ghcr-auth
            items:
              - key: .dockerconfigjson
                path: config.json
