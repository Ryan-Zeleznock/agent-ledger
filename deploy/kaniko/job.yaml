apiVersion: batch/v1
kind: Job
metadata:
  name: kaniko-agent-ledger
  namespace: build
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: kaniko-agent-ledger
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:v1.23.2
          args:
            - --context=tar:///work/context.tar.gz
            - --dockerfile=Dockerfile
            - --destination=ghcr.io/ryan-zeleznock/agent-ledger:slice-2b
            - --digest-file=/dev/termination-log
            - --reproducible
            - --cache=false
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: context
              mountPath: /work
              readOnly: true
            - name: auth
              mountPath: /kaniko/.docker
              readOnly: true
      volumes:
        - name: context
          configMap:
            name: agent-ledger-context
        - name: auth
          secret:
            secretName: ghcr-auth
            items:
              - key: .dockerconfigjson
                path: config.json
